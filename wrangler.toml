name = "melonrpc"
main = "src/index.ts"
compatibility_date = "2024-09-23"

# Per-IP rate limiting (Cloudflare native binding)
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 300
  period = 60

# Static assets
[site]
bucket = "./public"

